<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bears of Peace Ju Jutsu Oued Eslam</title>
<style>
  :root { --bg:#0e1116; --card:#181d26; --text:#f3f4f6; --muted:#9aa3b2; --accent:#d62828; --line:#2a3140; }
  * { box-sizing:border-box; }
  body { 
    margin:0; 
    font-family:"Segoe UI",Tahoma,Arial,sans-serif; 
    /* تم تغيير الخلفية هنا فقط */
    background: linear-gradient(rgba(14, 17, 22, 0.85), rgba(14, 17, 22, 0.85)), url('https://images.unsplash.com/photo-1555597673-b21d5c935865?auto=format&fit=crop&q=80') center/cover fixed; 
    color:var(--text); 
  }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  header { text-align:center; margin-bottom:20px; }
  header img { width:110px; height:110px; object-fit:contain; border-radius:50%; background:#fff; padding:4px; }
  h1 { font-size:1.25rem; margin:10px 0 0; letter-spacing:.5px; direction:ltr; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  label, .group-title { display:block; margin:14px 0 6px; color:var(--muted); font-size:.9rem; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f131a; color:var(--text); font-size:1rem; }
  input:focus { outline:2px solid var(--accent); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; }
  .choice { flex:1 1 30%; padding:12px 8px; border-radius:10px; border:1px solid var(--line); background:#0f131a; color:var(--text); font-size:.95rem; cursor:pointer; }
  .choice.times { flex:1 1 100%; }
  .choice.active { background:var(--accent); border-color:var(--accent); font-weight:700; }
  .btn { display:block; width:100%; margin-top:12px; padding:14px; border:0; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; }
  .primary { background:var(--accent); color:#fff; margin-top:20px; }
  .secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  .info, .msg { display:none; margin-top:12px; padding:12px; border-radius:10px; font-size:.95rem; line-height:1.6; }
  .info { background:#22283a; border:1px dashed var(--muted); }
  .msg.error { background:#3a1a1a; color:#ffb4b4; }
  .msg.ok { background:#16321f; color:#b8f5c9; }
  .show { display:block; }
  pre { white-space:pre-wrap; margin:8px 0 0; direction:rtl; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="Bears" src="">
    <h1>Bears of Peace Ju Jutsu Oued Eslam</h1>
  </header>

  <form class="card" id="form" novalidate>
    <label for="fname">الاسم</label>
    <input id="fname" type="text" autocomplete="given-name" required>

    <div class="row">
      <div><label for="lname">اللقب</label><input id="lname" type="text" autocomplete="family-name" required></div>
      <div><label for="age">العمر</label><input id="age" type="number" min="3" max="99" inputmode="numeric" required></div>
    </div>

    <span class="group-title">التخصص</span>
    <div class="choices" id="sports">
      <button type="button" class="choice" data-v="Ju Jutsu">Ju Jutsu</button>
      <button type="button" class="choice" data-v="MMA">MMA</button>
      <button type="button" class="choice" data-v="King Fu">King Fu</button>
    </div>

    <span class="group-title">الأوقات</span>
    <div class="choices" id="times">
      <button type="button" class="choice times" data-v="الاثنين 17:00---18:30">الاثنين 17:00---18:30</button>
      <button type="button" class="choice times" data-v="الأربعاء 17:00---18:30">الأربعاء 17:00---18:30</button>
      <button type="button" class="choice times" data-v="الجمعة 17:00---18:30">الجمعة 17:00---18:30</button>
    </div>

    <button type="button" class="btn secondary" id="fileBtn">الملف</button>
    <div class="info" id="fileInfo">يرجى التقرب من القاعة الرياضية لأخذ استمارة التسجيل</div>

    <button type="submit" class="btn primary">إرسال</button>
    <div class="msg" id="msg"></div>

    <a class="btn secondary" href="tel:0795760635">تواصل مع المسؤولين — 0795760635</a>
  </form>
</div>

<script>
  // ===== Settings =====
  const LOGO_URL = "https://i.ibb.co/vvB5ZmFH/1790268608620.jpg";
  const FB_PAGE  = "https://www.facebook.com/profile.php?id=61574944910883";
  const WEB3FORMS_KEY = "d3202d37-61c2-4ff2-84a9-1a78fe5dea52";  // free key from https://web3forms.com
  const MESSENGER = "https://m.me/61574944910883";            // opens a chat with the page

  const $ = id => document.getElementById(id);
  const selected = { sport: "", time: "" };

  // Logo with fallback if the link is not a direct image
  const logo = $("logo");
  logo.src = LOGO_URL;
  logo.onerror = () => { logo.onerror = null; logo.src = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"><text x="55" y="72" font-size="60" text-anchor="middle">🐻</text></svg>'); };

  // Single-choice button groups (sports / times)
  function bindGroup(groupId, key) {
    $(groupId).addEventListener("click", e => {
      const b = e.target.closest(".choice"); if (!b) return;
      $(groupId).querySelectorAll(".choice").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      selected[key] = b.dataset.v;
    });
  }
  bindGroup("sports", "sport");
  bindGroup("times", "time");

  // Toggle the "come to the gym" notice
  $("fileBtn").addEventListener("click", () => $("fileInfo").classList.toggle("show"));

  function showMsg(text, type) {
    const m = $("msg"); m.className = "msg show " + type; m.textContent = text;
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const fname = $("fname").value.trim(), lname = $("lname").value.trim(), age = $("age").value.trim();
    if (!fname || !lname || !age || !selected.sport || !selected.time)
      return showMsg("يرجى ملء جميع الخانات واختيار التخصص والوقت", "error");

    const text = `طلب تسجيل جديد\nالاسم: ${fname}\nاللقب: ${lname}\nالعمر: ${age}\nالتخصص: ${selected.sport}\nالوقت: ${selected.time}`;

    // 1) Real automatic sending (to the admin's email) via Web3Forms
    if (WEB3FORMS_KEY) {
      try {
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_KEY,
            subject: "تسجيل جديد - " + fname + " " + lname,
            from_name: "Bears of Peace Ju Jutsu",
            message: text
          })
        });
        const data = await res.json();
        if (data.success) {
          $("form").reset();
          document.querySelectorAll(".choice").forEach(x => x.classList.remove("active"));
          selected.sport = selected.time = "";
          return showMsg("تم إرسال تسجيلك بنجاح ✅ سنتواصل معك قريبًا", "ok");
        }
      } catch (_) {}
      return showMsg("تعذر الإرسال، حاول مرة أخرى أو تواصل معنا على 0795760635", "error");
    }

    // 2) Fallback (no key set): copy the text and open the page's Messenger chat
    try { await navigator.clipboard.writeText(text); } catch (_) {}
    showMsg("تم نسخ المعلومات. الصقها في المحادثة التي ستفتح مع صفحتنا ثم أرسلها.", "ok");
    const pre = document.createElement("pre"); pre.textContent = text; $("msg").appendChild(pre);
    window.open(MESSENGER, "_blank");
  });
</script>
</body>
</html>
